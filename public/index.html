<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatKhoj</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #fff; color: #202124; font-size: 14px; }
a { text-decoration: none; }

/* ===== HOME ===== */
.home-header { padding: 20px; text-align: center; }
.logo-big { font-size: 52px; font-weight: 400; margin: 60px 0 8px; letter-spacing: -2px; }
.logo-big span:nth-child(1), .logo-sm span:nth-child(1) { color: #4285F4; }
.logo-big span:nth-child(2), .logo-sm span:nth-child(2) { color: #EA4335; }
.logo-big span:nth-child(3), .logo-sm span:nth-child(3) { color: #FBBC05; }
.logo-big span:nth-child(4), .logo-sm span:nth-child(4) { color: #4285F4; }
.logo-big span:nth-child(5), .logo-sm span:nth-child(5) { color: #34A853; }
.logo-big span:nth-child(6), .logo-sm span:nth-child(6) { color: #EA4335; }
.logo-big span:nth-child(7), .logo-sm span:nth-child(7) { color: #4285F4; }
.logo-big span:nth-child(8), .logo-sm span:nth-child(8) { color: #FBBC05; }
.logo-big span:nth-child(9), .logo-sm span:nth-child(9) { color: #34A853; }
.logo-big span:nth-child(10), .logo-sm span:nth-child(10) { color: #EA4335; }
.tagline { color: #70757a; margin-bottom: 28px; font-size: 15px; }
.search-wrap { max-width: 584px; margin: 0 auto; position: relative; }
.search-wrap input { width: 100%; padding: 13px 90px 13px 22px; font-size: 16px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; }
.search-wrap input:hover { box-shadow: 0 1px 6px rgba(32,33,36,.28); }
.search-wrap input:focus { box-shadow: 0 1px 6px rgba(32,33,36,.28); }
.sicons { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); display: flex; gap: 12px; align-items: center; }
.sicons button { background: none; border: none; cursor: pointer; font-size: 18px; }
.home-btns { margin: 28px 0 12px; }
.home-btns button { background: #f8f9fa; border: 1px solid #f8f9fa; padding: 10px 18px; margin: 0 6px; border-radius: 4px; cursor: pointer; font-size: 14px; color: #3c4043; }
.home-btns button:hover { box-shadow: 0 1px 1px rgba(0,0,0,.1); border-color: #dadce0; }
.lucky { color: #1a73e8; font-size: 13px; cursor: pointer; }
.widgets { display: flex; gap: 14px; justify-content: center; margin: 34px 0 10px; flex-wrap: wrap; }
.widget { background: #fff; border: 1px solid #dfe1e5; border-radius: 12px; padding: 14px 22px; min-width: 160px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.widget .wl { font-size: 12px; color: #70757a; }
.widget .wv { font-size: 24px; font-weight: 400; margin: 4px 0; }
.widget .ws { font-size: 12px; color: #70757a; }
.discover { max-width: 720px; margin: 36px auto 60px; padding: 0 16px; }
.discover h2 { font-size: 20px; font-weight: 500; margin-bottom: 16px; color: #202124; }
/* Google-like Discover cards */
.dcard { border: 1px solid #e8eaed; border-radius: 16px; margin-bottom: 20px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(60,64,67,.12), 0 1px 2px rgba(60,64,67,.08); transition: box-shadow .2s ease; }
.dcard:hover { box-shadow: 0 4px 14px rgba(60,64,67,.18); }
.dcard-imgwrap { position: relative; aspect-ratio: 16/9; background: #f1f3f4; overflow: hidden; cursor: pointer; }
.dcard-imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dcard-noimg { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; font-size: 48px; background: linear-gradient(135deg, #e8f0fe, #f1f3f4); cursor: pointer; }
.dcard-body { padding: 14px 16px 6px; cursor: pointer; }
.dcard-title { font-size: 18px; font-weight: 600; line-height: 1.35; margin-bottom: 8px; color: #202124; }
.dcard-meta { font-size: 12px; color: #5f6368; display: flex; align-items: center; gap: 6px; }
.dcard-src { font-weight: 500; color: #3c4043; }
.dcard-actions { display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 6px; }
.dcard-act { display: flex; gap: 2px; }
.dcard-act button, .dmenu > button { background: none; border: none; cursor: pointer; font-size: 18px; padding: 8px; border-radius: 50%; color: #5f6368; line-height: 1; }
.dcard-act button:hover, .dmenu > button:hover { background: #f1f3f4; }
.dcard-act button.liked { color: #d93025; }
.dmenu { position: relative; }
.dmenu-pop { position: absolute; right: 0; bottom: 44px; background: #fff; border: 1px solid #dadce0; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.16); min-width: 190px; z-index: 5; display: none; overflow: hidden; }
.dmenu-pop.open { display: block; }
.dmenu-pop button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 11px 14px; font-size: 14px; cursor: pointer; color: #202124; }
.dmenu-pop button:hover { background: #f1f3f4; }
.dtoast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; font-size: 14px; padding: 12px 22px; border-radius: 8px; z-index: 99; opacity: 0; transition: opacity .25s; pointer-events: none; }
.dtoast.show { opacity: 1; }
@media (max-width: 520px) { .discover { padding: 0 12px; } .dcard-title { font-size: 17px; } }

/* ===== RESULTS PAGE ===== */
.rheader { border-bottom: 1px solid #ebebeb; padding: 14px 0 0; position: sticky; top: 0; background: #fff; z-index: 10; }
.rheader-top { display: flex; align-items: center; gap: 24px; padding: 0 24px; max-width: 1300px; }
.logo-sm { font-size: 26px; font-weight: 400; letter-spacing: -1px; cursor: pointer; white-space: nowrap; }
.rsearch { flex: 1; max-width: 650px; position: relative; }
.rsearch input { width: 100%; padding: 12px 90px 12px 20px; font-size: 16px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,.08); }
.rsearch input:focus { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.tabs { display: flex; gap: 4px; padding: 0 24px; max-width: 1300px; overflow-x: auto; margin-top: 6px; }
.tabs button { background: none; border: none; padding: 12px 12px; cursor: pointer; font-size: 13px; color: #5f6368; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.tabs button.active { color: #1a73e8; border-bottom-color: #1a73e8; }
.tabs button:hover { color: #202124; }
.rmain { max-width: 652px; margin: 0 0 0 24px; padding: 0 20px 0 0; }
@media (min-width: 1100px) { .rmain { margin-left: 180px; } .rheader-top, .tabs { padding-left: 180px; max-width: none; } }
.stats { color: #70757a; font-size: 13px; padding: 12px 0 18px; }

/* Knowledge panel - Google style */
/* ===== KNOWLEDGE PANEL (Google-naap, inline main column) ===== */
.kp { margin: 2px 0 26px; background: #fff; }
.kp-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 6px 0 12px; }
.kp-name { font-size: 28px; font-weight: 400; line-height: 1.25; color: #202124; }
.kp-sub { font-size: 14px; color: #70757a; margin-top: 2px; }
.kp-menuwrap { position: relative; flex-shrink: 0; }
.kp-menu { background: none; border: none; font-size: 20px; color: #5f6368; cursor: pointer; padding: 2px 10px; border-radius: 50%; line-height: 1.4; }
.kp-menu:hover { background: #f1f3f4; color: #202124; }
.kp-menupop { display: none; position: absolute; right: 0; top: 34px; background: #fff; border: 1px solid #dfe1e5; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,.16); z-index: 60; min-width: 150px; overflow: hidden; }
.kp-menupop.show { display: block; }
.kp-menupop button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 11px 16px; font-size: 14px; cursor: pointer; color: #202124; }
.kp-menupop button:hover { background: #f1f3f4; }
.kp-media { display: grid; grid-template-columns: 1.55fr 1fr; gap: 3px; border-radius: 14px; overflow: hidden; margin: 2px 0 4px; }
.kp-m-main img { width: 100%; height: 224px; object-fit: cover; display: block; cursor: pointer; }
.kp-m-side { display: grid; grid-template-rows: 1fr 1fr; gap: 3px; }
.kp-m-cell { position: relative; min-height: 0; }
.kp-m-cell img { width: 100%; height: 110px; object-fit: cover; display: block; cursor: pointer; }
.kp-moreimg { position: absolute; right: 8px; bottom: 8px; background: rgba(255,255,255,.96); border: 1px solid #dfe1e5; border-radius: 16px; padding: 6px 13px; font-size: 13px; color: #1a73e8; cursor: pointer; font-weight: 500; }
.kp-moreimg:hover { background: #f6fafe; }
.kp-media-row { display: flex; gap: 3px; border-radius: 14px; overflow: hidden; margin: 2px 0 4px; }
.kp-media-row img { height: 170px; flex: 1; min-width: 0; object-fit: cover; cursor: pointer; }
.kp-tabs { display: flex; gap: 2px; border-bottom: 1px solid #ebebeb; margin: 10px 0 0; }
.kp-tabs button { background: none; border: none; font-size: 14px; color: #5f6368; padding: 11px 16px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.kp-tabs button:hover { color: #202124; }
.kp-tabs button.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 500; }
.kp-desc-h { font-size: 18px; font-weight: 500; color: #202124; margin: 18px 0 8px; }
.kp-desc { font-size: 14px; line-height: 1.65; color: #4d5156; }
.kp-desc a { color: #1a73e8; }
.kp-facts { margin-top: 14px; border-top: 1px solid #ecedef; }
.kp-facts .fr { display: flex; gap: 18px; padding: 9px 12px; font-size: 14px; border-bottom: 1px solid #ecedef; }
.kp-facts .fr.alt { background: #f8f9fa; }
.kp-facts .fr span:first-child { color: #70757a; min-width: 118px; flex-shrink: 0; }
.kp-facts .fv { color: #202124; }
.kp-feedback { background: none; border: none; color: #70757a; font-size: 12px; cursor: pointer; padding: 9px 0 2px; }
.kp-feedback:hover { text-decoration: underline; }
.kp-profiles { margin-top: 6px; }
.kp-profiles a { display: inline-block; margin: 0 14px 8px 0; color: #1a73e8; font-size: 14px; }
.kp-stats-tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
.kp-stats-tbl th { text-align: left; color: #70757a; font-weight: 500; font-size: 13px; padding: 8px 10px; border-bottom: 1px solid #ecedef; }
.kp-stats-tbl td { padding: 8px 10px; border-bottom: 1px solid #ecedef; color: #202124; }
.kp-stats-tbl td:first-child { font-weight: 500; }

/* Web results */
.wr { margin-bottom: 30px; }
.wr-cite { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.wr-fav { width: 26px; height: 26px; border-radius: 50%; background: #f1f3f4; object-fit: cover; flex-shrink: 0; }
.wr-urlblock { line-height: 1.35; }
.wr-site { font-size: 14px; color: #202124; }
.wr-url { font-size: 12px; color: #5f6368; }
.wr-title { font-size: 20px; font-weight: 400; color: #1a0dab; line-height: 1.3; display: inline-block; margin: 2px 0 4px; cursor: pointer; }
.wr-title:hover { text-decoration: underline; }
.wr-snip { font-size: 14px; color: #4d5156; line-height: 1.58; }

/* People also ask */
.paa { margin: 10px 0 30px; }
.paa h3 { font-size: 20px; font-weight: 400; margin-bottom: 12px; }
.paa-item { border-top: 1px solid #ebebeb; }
.paa-item:last-child { border-bottom: 1px solid #ebebeb; }
.paa-q { width: 100%; background: none; border: none; text-align: left; font-size: 16px; padding: 14px 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #202124; }
.paa-q:hover { color: #1a0dab; }
.paa-a { font-size: 14px; color: #4d5156; line-height: 1.6; padding: 0 4px 16px; display: none; }
.paa-a.show { display: block; }
.paa-a .src { font-size: 12px; color: #1a73e8; margin-top: 8px; display: block; }

/* Pagination */
.pg { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 36px 0 50px; flex-wrap: wrap; }
.pg button { min-width: 36px; height: 36px; border: none; background: none; font-size: 14px; color: #1a73e8; cursor: pointer; border-radius: 50%; }
.pg button:hover { background: #f1f3f4; }
.pg button.cur { color: #202124; font-weight: 700; cursor: default; }
.pg button.cur:hover { background: none; }
.pg .nxt { border-radius: 18px; padding: 0 14px; }

/* Image grid */
.img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; padding: 6px 24px 40px; max-width: 1200px; }
.img-item { border-radius: 8px; overflow: hidden; cursor: pointer; aspect-ratio: 1; background: #f1f3f4; }
.img-item img { width: 100%; height: 100%; object-fit: cover; }
.img-item:hover img { transform: scale(1.03); transition: transform .2s; }

/* Videos */
.vcard { display: flex; gap: 14px; margin-bottom: 26px; cursor: pointer; }
.vthumb { width: 200px; height: 115px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #f1f3f4; }
.vtitle { font-size: 17px; color: #1a0dab; margin-bottom: 5px; line-height: 1.35; font-weight: 400; }
.vmeta { font-size: 12px; color: #70757a; margin-bottom: 6px; }
.vsnip { font-size: 13px; color: #4d5156; line-height: 1.5; }

/* AI Mode */
.ai-card { background: #f0f4f9; border-radius: 18px; padding: 22px 24px; margin-bottom: 14px; font-size: 15px; line-height: 1.75; color: #1f1f1f; }
.ai-card h3 { font-size: 17px; margin-bottom: 12px; font-weight: 500; }
.ai-card p { margin-bottom: 10px; }
.ai-card strong { font-weight: 600; }
.ai-card sup.cite a { background: #d3e3fd; color: #0b57d0; border-radius: 6px; padding: 1px 6px; font-size: 11px; margin: 0 2px; font-weight: 500; }
.ai-src-h { font-size: 18px; font-weight: 500; margin: 20px 0 12px; }
.ai-src { display: flex; gap: 12px; padding: 12px; border: 1px solid #dfe1e5; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
.ai-src:hover { background: #f8f9fa; }
.ai-src-n { background: #0b57d0; color: #fff; min-width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
.ai-src-t { font-size: 14px; color: #1a0dab; }
.ai-src-d { font-size: 12px; color: #5f6368; margin-top: 2px; }
.ai-src-s { font-size: 13px; color: #4d5156; margin-top: 5px; line-height: 1.5; }
.ai-disc { font-size: 12px; color: #70757a; margin: 16px 0 30px; }
.ai-hero { text-align: center; padding: 40px 20px 20px; }
.ai-hero-t { font-size: 32px; font-weight: 500; color: #0b57d0; margin-bottom: 8px; }
.ai-hero-s { font-size: 16px; color: #5f6368; }
.ai-follow { position: sticky; bottom: 20px; margin: 20px 0 30px; }
.ai-follow-box { display: flex; gap: 10px; background: #fff; border: 1px solid #dfe1e5; border-radius: 28px; padding: 6px 6px 6px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); align-items: center; }
.ai-follow-box input { flex: 1; border: none; outline: none; font-size: 15px; padding: 10px 0; }
.ai-follow-box button { background: #0b57d0; color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
.ai-follow-box button:hover { background: #0842a0; }
.ai-conv { margin-bottom: 16px; }
.ai-q { background: #e8f0fe; border-radius: 16px 16px 4px 16px; padding: 12px 18px; margin: 12px 0 8px 40px; font-size: 15px; text-align: right; }

/* ===== GOOGLE-STYLE TWO COLUMN ===== */
.rbody-wrap { display: flex; gap: 40px; max-width: 1300px; margin: 0; padding: 0 24px; }
@media (min-width: 1100px) { .rbody-wrap { padding-left: 180px; } }
.rmain { flex: 1; max-width: 652px; min-width: 0; padding: 0 20px 0 0; margin: 0; }
/* (rside retired: panel ab main column me inline hai, Google-naap) */

/* Top Stories */
.tstories { margin: 6px 0 24px; }
.tstories h3 { font-size: 20px; font-weight: 400; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.ts-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.ts-card { min-width: 180px; max-width: 200px; border: 1px solid #dfe1e5; border-radius: 12px; overflow: hidden; cursor: pointer; flex-shrink: 0; background: #fff; }
.ts-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.ts-card img { width: 100%; height: 100px; object-fit: cover; background: #f1f3f4; }
.ts-card .ts-t { font-size: 13px; line-height: 1.4; padding: 10px 12px 4px; color: #202124; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ts-card .ts-s { font-size: 11px; color: #70757a; padding: 0 12px 10px; }

/* People also search for */
.pasf { margin: 20px 0 30px; }
.pasf h3 { font-size: 20px; font-weight: 400; margin-bottom: 12px; }
.pasf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pasf-item { background: #f1f3f4; border-radius: 20px; padding: 10px 18px; font-size: 14px; color: #202124; cursor: pointer; border: none; text-align: left; }
.pasf-item:hover { background: #e8eaed; }

/* Search tools */
.stools { position: relative; display: inline-block; margin-left: 8px; }
.stools-btn { background: none; border: 1px solid #dfe1e5; border-radius: 18px; padding: 6px 14px; font-size: 13px; color: #5f6368; cursor: pointer; }
.stools-btn:hover { background: #f8f9fa; }
.stools-menu { display: none; position: absolute; top: 36px; left: 0; background: #fff; border: 1px solid #dfe1e5; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 20; min-width: 180px; }
.stools-menu.show { display: block; }
.stools-menu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 10px 16px; font-size: 14px; cursor: pointer; color: #202124; }
.stools-menu button:hover { background: #f1f3f4; }

/* Footer */
.rfooter { background: #f2f2f2; border-top: 1px solid #e4e4e4; margin-top: 20px; }
.rfooter .loc { padding: 14px 24px; font-size: 14px; color: #70757a; border-bottom: 1px solid #e4e4e4; }
@media (min-width: 1100px) { .rfooter .loc, .rfooter .fl { padding-left: 180px; } }
.rfooter .fl { padding: 12px 24px; display: flex; gap: 24px; flex-wrap: wrap; }
.rfooter .fl a { font-size: 13px; color: #70757a; }
.rfooter .fl a:hover { color: #202124; }

.loading { text-align: center; padding: 50px; color: #70757a; }
.errbox { text-align: center; padding: 50px 20px; color: #70757a; }
.backhome { display: block; text-align: center; margin: 24px; color: #1a73e8; font-size: 14px; }

/* ===== LIVE DATA (better than Google) ===== */
.live-sec { max-width: 680px; margin: 28px auto 0; padding: 0 20px; }
.live-sec h2 { font-size: 20px; font-weight: 400; margin-bottom: 12px; color: #202124; }
.trend-list { list-style: none; }
.trend-item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
.trend-item:hover { background: #f8f9fa; }
.trend-item:last-child { border-bottom: none; }
.trend-rank { color: #9aa0a6; font-size: 13px; min-width: 20px; }
.trend-icon { font-size: 16px; }
.trend-title { font-size: 15px; color: #202124; flex: 1; line-height: 1.4; }
.trend-src { font-size: 12px; color: #70757a; white-space: nowrap; }
.stock-up { color: #137333; }
.stock-dn { color: #c5221f; }
.widget .wv-small { font-size: 18px; font-weight: 400; margin: 4px 0; }
.crick-item { padding: 10px 4px; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
.crick-item:hover { background: #f8f9fa; }
.crick-item:last-child { border-bottom: none; }
.crick-title { font-size: 14px; color: #202124; line-height: 1.4; }
.crick-src { font-size: 12px; color: #70757a; margin-top: 3px; }
@media (max-width: 600px) {
  .logo-big { font-size: 40px; }
  .widget { min-width: 140px; padding: 12px 14px; }
  .trend-src { display: none; }
}

/* ===== GOOGLE-PARITY UI OVERHAUL ===== */
/* --- Homepage: Google-app style search bar (G mark + mic + avatar) --- */
.home-header { position: relative; }
.home-avatar { position: absolute; top: 14px; right: 16px; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,#1a73e8,#9b72cb,#d96570); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; cursor: pointer; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.25); }
.search-wrap .gmark { position: absolute; left: 19px; top: 50%; transform: translateY(-50%); font-size: 22px; font-weight: 700; letter-spacing: -1px; pointer-events: none; z-index: 2; }
.search-wrap .gmark .b{color:#4285F4}.search-wrap .gmark .r{color:#EA4335}.search-wrap .gmark .y{color:#FBBC05}.search-wrap .gmark .g{color:#34A853}
.search-wrap input { padding-left: 54px !important; }

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function renderMD(text, sources) {
  let h = esc(text);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[(\d+)\]/g, (m,n) => {
    const s = (sources||[]).find(x => String(x.n)===n);
    return `<sup class="cite"><a href="${esc(s?s.url:'#')}" target="_blank">${n}</a></sup>`;
  });
  return '<p>' + h.replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>') + '</p>';
}
function aiAnswerHTML(q, answer, srcs) {
  return `<div class="ai-conv"><div class="ai-q">${esc(q)}</div>`
    + `<div class="ai-card">${renderMD(answer, srcs)}</div>`
    + (srcs.length?`<div class="ai-src-h" style="font-size:15px;">📚 Sources</div>`+srcs.slice(0,5).map(s=>
      `<div class="ai-src" onclick="window.open('${esc(s.url)}','_blank')"><div class="ai-src-n">${s.n}</div><div><div class="ai-src-t">${esc(s.title||s.url)}</div><div class="ai-src-d">${esc(s.domain||'')}</div></div></div>`).join(''):'')
    + `</div>`;
}

    + `<button class="aiov-toggle" onclick="(function(el){var m=el.parentElement.querySelector('.aiov-more');var open=m.style.display!=='none';m.style.display=open?'none':'block';el.textContent=open?'Show more':'Show less';})(this)">Show more</button>`
    + `</div>`;
}
async function askFollowUp() {
  const inp = document.getElementById('aiFollowInput');
  const q = inp.value.trim();
  if (!q) return;
  inp.value = '';
  const conv = document.getElementById('aiConv');
  conv.innerHTML += `<div class="ai-conv"><div class="ai-q">${esc(q)}</div><div class="ai-card"><div class="loading" style="padding:20px;">Soch raha hoon…</div></div></div>`;
  conv.lastElementChild.scrollIntoView({behavior:'smooth', block:'nearest'});
  try {
    const ctx = aiHistory.length ? ` (context: ${aiHistory[aiHistory.length-1].q})` : '';
    const r = await fetch('/.netlify/functions/ai?q='+encodeURIComponent(q+ctx));
    const d = await r.json();
    conv.lastElementChild.remove();
    if (d.answer) {
      aiHistory.push({q: q, a: d.answer, s: d.sources||[]});
      conv.innerHTML += aiAnswerHTML(q, d.answer, d.sources||[]);
    } else {
      conv.innerHTML += `<div class="ai-conv"><div class="ai-card">😔 Jawab nahi mil paya. Dobara try karein.</div></div>`;
    }
    conv.lastElementChild.scrollIntoView({behavior:'smooth', block:'nearest'});
  } catch(e) {
    conv.lastElementChild.remove();
    conv.innerHTML += `<div class="ai-conv"><div class="ai-card">😔 Error. Dobara try karein.</div></div>`;
  }
}

function openCard(el) { const u = el.closest('.dcard').dataset.url; if (u) window.open(u, '_blank'); }
function imgFallback(img) { const d = document.createElement('div'); d.className = 'dcard-noimg'; d.textContent = '📰'; d.onclick = function(){ openCard(this); }; img.replaceWith(d); }
function timeAgo(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime(); if (isNaN(t)) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if (d === 1) return 'Yesterday';
  if (d < 7) return d + 'd ago';
  return new Date(t).toLocaleDateString('en-IN');
}
function toggleLike(btn) { const on = btn.classList.toggle('liked'); btn.textContent = on ? '♥' : '♡'; }
function shareCard(btn) {
  const card = btn.closest('.dcard');
  const url = card.dataset.url, title = card.querySelector('.dcard-title').textContent;
  closeMenus();
  if (navigator.share) { navigator.share({ title: title, url: url }).catch(()=>{}); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
    () => showToast('Link copied!'), () => showToast('Copy this link: ' + url));
}
function toggleMenu(btn) {
  const pop = btn.nextElementSibling, was = pop.classList.contains('open');
  closeMenus(); if (!was) pop.classList.add('open');
}
function closeMenus() { document.querySelectorAll('.dmenu-pop.open').forEach(p => p.classList.remove('open')); }
function hideCard(btn) { const card = btn.closest('.dcard'); card.style.display = 'none'; showToast('Got it — fewer stories like this'); }
function showToast(msg) {
  let t = document.querySelector('.dtoast');
  if (!t) { t = document.createElement('div'); t.className = 'dtoast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function toggleDesc(el) {
  const d = el.parentElement.querySelector('.dcard-desc');
  if (!d) return;
  const open = d.classList.toggle('open');
  el.textContent = open ? 'See less' : 'See more';
}
function voiceSearch(inputId) {
  const inp = document.getElementById(inputId);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('Voice search is not supported on this browser'); return; }
  const rec = new SR(); rec.lang = 'hi-IN'; rec.interimResults = false;
  showToast('Listening… boliye');
  rec.onresult = e => { inp.value = e.results[0][0].transcript; (inputId==='searchInput2'?doSearch2:doSearch)(); };
  rec.onerror = () => showToast('Voice search failed. Dobara try karein.');
  try { rec.start(); } catch(e) { showToast('Voice search failed.'); }
}

async function loadDiscover() {
  if (loadingDiscover) return; loadingDiscover = true;
  try {
    const r = await fetch('/.netlify/functions/discover?page='+discoverPage);
    const d = await r.json();
    const feed = document.getElementById('discoverFeed');
    if (discoverPage===1) feed.innerHTML='';
    let added = 0;
    (d.news||[]).forEach(s => {
      if (discoverSeen.has(s.url)) return; // duplicate skip = har baar naya feel
      discoverSeen.add(s.url);
      added++;
      const desc = s.snippet||s.description||s.summary||'';
      const longDesc = desc.length > 120;
      feed.innerHTML += `<div class="dcard" data-url="${esc(s.url)}">`
        + `<div class="dcard-imgwrap" onclick="openCard(this)">`
        + (s.image?`<img src="${esc(s.image)}" loading="lazy" alt="" onerror="imgFallback(this)">`:`<div class="dcard-noimg">📰</div>`)
        + (s.source?`<span class="dcard-srcchip">🔗 ${esc(s.source)}</span>`:'')
        + `</div>`
        + `<div class="dcard-body" onclick="openCard(this)"><div class="dcard-title">${esc(s.title)}</div>`
        + (desc?`<div class="dcard-desc">${esc(desc)}</div>`:'')
        + (longDesc?`<span class="dcard-seemore" onclick="event.stopPropagation();toggleDesc(this)">See more</span>`:'')
        + `<div class="dcard-meta"><span class="dcard-src">${esc(s.source||'')}</span><span>•</span><span>${timeAgo(s.published)}</span></div></div>`
        + `<div class="dcard-actions"><div class="dcard-act"><span class="spark" title="AI summary">✦</span><button onclick="toggleLike(this)" aria-label="Like">♡</button><button onclick="shareCard(this)" aria-label="Share">↗</button></div>`
        + `<div class="dmenu"><button onclick="toggleMenu(this)" aria-label="More options">⋮</button><div class="dmenu-pop"><button onclick="hideCard(this)">🚫 Not interested</button><button onclick="shareCard(this)">↗ Share</button></div></div></div></div>`;
    });
    discoverPage++;
    // Unlimited: khatm ho to page 1 se loop — seen clear taaki phir se dikhe
    if (!d.has_more) { discoverPage = 1; discoverSeen.clear(); }
    loadingDiscover = false;
  } catch(e) {
    if (discoverPage===1) document.getElementById('discoverFeed').innerHTML='<div class="errbox">Stories load nahi ho payi.</div>';
    loadingDiscover = false;
  }
}

async function kpHTML(q, kp) {
  // Photos: backend image + images-tab fetch (sirf real photos)
  // images_locked (owner panel jaise): random image-search photos KABHI mat jodo
  let photos = kp.image?[kp.image]:[];
  if (!kp.images_locked) {
    try {
      const r = await fetch('/.netlify/functions/search?q='+encodeURIComponent(q)+'&type=images&limit=8');
      const d = await r.json();
      (d.results||[]).forEach(im=>{ const u=im.thumb_url||im.thumbnail||im.image_url; if(u&&!photos.includes(u)) photos.push(u); });
    } catch(e){}
  }
  photos = photos.slice(0,6);
  const shareUrl = 'https://bharatkhoj-netlify.netlify.app/?q=' + encodeURIComponent(q);

  // Family facts: PERMANENT BAN (spouse/children/parents/siblings) — backend bheje tab bhi nahi dikhenge
  const BANNED = /spouse|husband|wife|children|\bson\b|\bdaughter\b|parents|\bfather\b|\bmother\b|siblings|\bbrother\b|\bsister\b|family/i;
  const rows = [];
  const f = kp.fields||{};
  const push = (l,v)=>{ if(!v||BANNED.test(l)) return; const val=String(v).trim(); if(!val) return;
    if(!rows.some(r=>r[0].toLowerCase()===l.toLowerCase())) rows.push([l,val]); };
  if(f.occupation&&f.occupation.length) push('Occupation', f.occupation.join(', '));
  if(f.role) push('Role', f.role);
  if(f.born) push('Born', f.born);
  if(f.birth_place||f.born_place) push('Birth place', f.birth_place||f.born_place);
  if(f.died) push('Died', f.died);
  if(f.height) push('Height', f.height);
  if(f.nationality) push('Nationality', f.nationality);
  if(f.education&&f.education.length) push('Education', f.education.slice(0,3).join(', '));
  if(f.teams&&f.teams.length) push('Current teams', f.teams.join(', '));
  if(f.notable_works&&f.notable_works.length) push('Notable works', f.notable_works.slice(0,5).join(', '));
  if(f.awards&&f.awards.length) push('Awards', f.awards.slice(0,4).join(', '));
  if(f.founded) push('Founded', f.founded);
  if(f.headquarters) push('Headquarters', f.headquarters);
  if(f.country) push('Country', f.country);
  (kp.facts||[]).forEach(x=>{ if(x&&x.label&&x.value) push(x.label, x.value); });

  // Featured-results media collage (Google: 1 badi + 2 stacked + "More images")
  let media = '';
  if (photos.length>=3) {
    media = `<div class="kp-media"><div class="kp-m-main"><img src="${esc(photos[0])}" loading="lazy" onerror="this.closest('.kp-media').remove()" onclick="window.open('${esc(photos[0])}','_blank')" alt=""></div><div class="kp-m-side">`
      + [photos[1],photos[2]].map((p,i)=>`<div class="kp-m-cell"><img src="${esc(p)}" loading="lazy" onerror="this.closest('.kp-m-cell').remove()" onclick="window.open('${esc(p)}','_blank')" alt="">`
        + (i===1?`<button class="kp-moreimg" onclick="event.stopPropagation();switchTab('images')">More images</button>`:'')+`</div>`).join('')
      + `</div></div>`;
  } else if (photos.length) {
    media = `<div class="kp-media-row">`+photos.map(p=>`<img src="${esc(p)}" loading="lazy" onerror="this.remove()" onclick="window.open('${esc(p)}','_blank')" alt="">`).join('')+`</div>`;
  }

  // Sub-tabs (Google: Overview/Stats/Videos/News — sirf jisme data ho)
  let tabs = `<button class="active" onclick="kpShowTab('ov',this)">Overview</button>`;
  if (kp.stats && kp.stats.length) tabs += `<button onclick="kpShowTab('st',this)">Stats</button>`;
  tabs += `<button onclick="switchTab('images')">Images</button><button onclick="switchTab('news')">News</button>`;

  let statsHtml = '';
  if (kp.stats && kp.stats.length) {
    const cols = Object.keys(kp.stats[0]);
    statsHtml = `<div class="kp-desc-h">Stats</div><div style="overflow-x:auto;"><table class="kp-stats-tbl"><tr>`
      + cols.map(c=>`<th>${esc(c)}</th>`).join('') + `</tr>`
      + kp.stats.map(row=>`<tr>`+cols.map(c=>`<td>${esc(row[c]??'—')}</td>`).join('')+`</tr>`).join('')
      + `</table></div>`;
  }

  return `<div class="kp" id="kpanel">`
    + `<div class="kp-head"><div><div class="kp-name">${esc(kp.name||q)}</div>`
    + ((kp.subtitle||kp.name_hi)?`<div class="kp-sub">${esc(kp.subtitle||kp.name_hi||'')}</div>`:'')
    + `</div><div class="kp-menuwrap"><button class="kp-menu" onclick="event.stopPropagation();document.getElementById('kpMenu').classList.toggle('show')" title="More options">⋮</button>`
    + `<div class="kp-menupop" id="kpMenu"><button onclick="kpShare('${esc(shareUrl)}','${esc(kp.name||q).replace(/'/g,"\\'")}')">Share</button><button onclick="navigator.clipboard.writeText('${esc(shareUrl)}');this.textContent='Copied!';setTimeout(()=>document.getElementById('kpMenu').classList.remove('show'),600)">Copy link</button></div></div></div>`
    + media
    + `<div class="kp-tabs">${tabs}</div>`
    + `<div id="kpTab-ov">`
    + (kp.description?`<div class="kp-desc-h">Description</div><div class="kp-desc">${esc(kp.description.substring(0,600))}${kp.description.length>600?'…':''} ${kp.wikipedia?`<a href="${esc(kp.wikipedia)}" target="_blank">Wikipedia</a>`:''}</div>`:'')
    + (rows.length?`<div class="kp-facts">`+rows.slice(0,12).map((r,i)=>`<div class="fr${i%2?' alt':''}"><span>${esc(r[0])}</span><span class="fv">${esc(r[1])}</span></div>`).join('')+`</div><button class="kp-feedback" onclick="alert('Thanks for your feedback!')">Feedback</button>`:'')
    + `</div>`
    + (statsHtml?`<div id="kpTab-st" style="display:none;">${statsHtml}</div>`:'')
    + ((kp.profiles&&kp.profiles.length)?`<div class="kp-profiles"><div class="kp-desc-h">Profiles</div>`+kp.profiles.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.label||p.url)}</a>`).join('')+`</div>`:'')
    + `</div>`;
}
function kpShowTab(which, btn){
  document.querySelectorAll('#kpanel .kp-tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const ov = document.getElementById('kpTab-ov'), st = document.getElementById('kpTab-st');
  if(ov) ov.style.display = which==='ov'?'':'none';

    `${ent} kaun hai?`,

    `${ent} ke baare me latest news kya hai?`,

  ];
  return `<div class="paa"><h3>People also ask</h3>` + qs.map((x,i)=>
    `<div class="paa-item"><button class="paa-q" onclick="togglePAA(${i},'${esc(x).replace(/'/g,"\\'")}')">${esc(x)}<span>⌄</span></button><div class="paa-a" id="paa-a-${i}"><div class="loading" style="padding:16px;">Loading…</div></div></div>`
  ).join('') + `</div>`;
}
async function togglePAA(i, q) {
  const el = document.getElementById('paa-a-'+i);
  el.classList.toggle('show');
  if (el.dataset.done) return;
  el.dataset.done = 1;
  try {
    const r = await fetch('/.netlify/functions/ai?q='+encodeURIComponent(q));
    const d = await r.json();
    if (d.answer) {
      const s0 = (d.sources||[])[0];
      el.innerHTML = renderMD(d.answer.substring(0,600)+(d.answer.length>600?'…':''), d.sources)
        + (s0?`<a class="src" href="${esc(s0.url)}" target="_blank">Source: ${esc(s0.domain||s0.url)}</a>`:'');
    } else el.innerHTML = 'Jawab nahi mil paya.';
  } catch(e){ el.innerHTML = 'Jawab nahi mil paya.'; }
}

/* ---------- PAGINATION ---------- */
function pgHTML(total, page, perPage) {
  const pages = Math.min(10, Math.max(1, Math.ceil(total/perPage)));
  if (pages<=1) return '';
  let h = `<div class="pg">`;
  for (let p=1;p<=pages;p++) h += `<button class="${p===page?'cur':''}" ${p===page?'':`onclick="goPage(${p})"`}>${p}</button>`;
  if (page<pages) h += `<button class="nxt" onclick="goPage(${page+1})">Next ›</button>`;
  return h+`</div>`;
}
